# Replaces .github/workflows/sphinx-gh-pages.yml.
#
# The Sphinx workflow used the sphinx-notes/pages action, which built and
# deployed in one opaque step. This one is explicit, which matters here: the
# build has to fail on a broken internal link (--strict) rather than publish a
# site with holes in it.
#
# Delete the Sphinx workflow in the same commit that adds this one — two
# workflows both deploying to Pages will race and the loser silently wins
# every other run.
name: Deploy Zensical documentation to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; cancel superseded runs rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned exactly. A site that builds today must build identically in six
      # months (TDD §4). Bump this deliberately, in its own commit.
      - run: pip install zensical==0.0.55

      - name: Build (strict)
        run: zensical build --clean --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
