<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- celbridge-redirect-stub -->
    <meta charset="utf-8">
    <title>Redirecting - Celbridge Docs</title>
    <link rel="canonical" href="https://learn.celbridge.org/">
    <meta http-equiv="refresh" content="0; url=./">
    <script>
      // Carries the fragment across, which the meta refresh on its own drops.
      location.replace("./" + location.hash);
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="./">https://learn.celbridge.org/</a>.</p>
  </body>
</html>
