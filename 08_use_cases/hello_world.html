<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- celbridge-redirect-stub -->
    <meta charset="utf-8">
    <title>Redirecting - Celbridge Docs</title>
    <link rel="canonical" href="https://celbridge-org.github.io/celbridge-docs/08_use_cases/hello_world/">
    <meta http-equiv="refresh" content="0; url=hello_world/">
    <script>
      // Carries the fragment across, which the meta refresh on its own drops.
      location.replace("hello_world/" + location.hash);
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="hello_world/">https://celbridge-org.github.io/celbridge-docs/08_use_cases/hello_world/</a>.</p>
  </body>
</html>
