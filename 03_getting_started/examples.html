<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- celbridge-redirect-stub -->
    <meta charset="utf-8">
    <title>Redirecting - Celbridge Docs</title>
    <link rel="canonical" href="https://celbridge-org.github.io/celbridge-docs/03_getting_started/examples/">
    <meta http-equiv="refresh" content="0; url=examples/">
    <script>
      // Carries the fragment across, which the meta refresh on its own drops.
      location.replace("examples/" + location.hash);
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="examples/">https://celbridge-org.github.io/celbridge-docs/03_getting_started/examples/</a>.</p>
  </body>
</html>
