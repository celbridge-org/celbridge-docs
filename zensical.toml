# Zensical replacement for the Sphinx build in celbridge-docs.
#
# Nav below replaces the five `toctree` directives in the old docs/index.rst;
# the captions become the section headings in the sidebar.

[project]
site_name = "Celbridge Docs"
site_url = "https://celbridge-org.github.io/celbridge-docs/"
site_description = "Documentation for Celbridge — the free and open source Python and data pipeline workbench."
site_author = "Celbridge team"
copyright = "2025-present — Celbridge community (CC BY 4.0)"

repo_url = "https://github.com/celbridge-org/celbridge-docs"
repo_name = "celbridge-org/celbridge-docs"
edit_uri = "edit/main/docs/"

strict = true

nav = [
  { "Celbridge Docs" = "index.md" },
  { About = [
    { Overview = "01_about/index.md" },
    { "Frequently asked questions" = "01_about/faq.md" },
  ] },
  { "Setting up" = [
    { Installation = "02_setup/installation.md" },
    { "System requirements" = "02_setup/system_requirements.md" },
    { "Python versions and packages" = "02_setup/python_versions.md" },
  ] },
  { "Getting started" = [
    { "Getting started" = "03_getting_started/index.md" },
    { "The Examples project" = "03_getting_started/examples.md" },
    { "Useful features" = "03_getting_started/useful_features.md" },
    { "Using the console" = "03_getting_started/console.md" },
  ] },
  { "Examples of use" = [
    { "Hello World" = "08_use_cases/hello_world.md" },
    { "Web application file" = "08_use_cases/webapp.md" },
    { "Setting up Sphinx" = "08_use_cases/sphinx.md" },
  ] },
  { Community = [
    { Community = "09_community/index.md" },
  ] },
]

[project.theme]
name = "material"
language = "en"
logo = "images/icon2.svg"
favicon = "images/icon.svg"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# Google Fonts would be a third-party request (TDD §16) — self-hosted in celbridge.css.
font = false

# [project.theme.font]
# text = "Inter"
# code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

extra_css = ["_static/css/celbridge.css"]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/celbridge-org/celbridge"
name = "Celbridge on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discourse"
link = "https://celbridge.discourse.group"
name = "Celbridge Workshop forum"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.toc_depth = 3
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
